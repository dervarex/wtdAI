name: sweep

on:
  workflow_dispatch:

env:
  # the full training data is 50 million words, too much for 6 hours on a cpu runner
  MAX_WORDS: "2000000"

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            epochs: 10
            hidden: 64
            context: 3
            vocab: 2000
          - name: wide
            epochs: 10
            hidden: 128
            context: 3
            vocab: 2000
          - name: long
            epochs: 30
            hidden: 64
            context: 3
            vocab: 2000
          - name: ctx5
            epochs: 10
            hidden: 64
            context: 5
            vocab: 2000
          - name: ctx5-wide
            epochs: 10
            hidden: 128
            context: 5
            vocab: 2000
          - name: big-vocab
            epochs: 10
            hidden: 64
            context: 3
            vocab: 5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Download training data
        run: ./gradlew downloadData

      - name: Train ${{ matrix.name }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew run --args="--debug --epochs ${{ matrix.epochs }} --hidden ${{ matrix.hidden }} --context ${{ matrix.context }} --vocab ${{ matrix.vocab }} --threads 4 --max-words $MAX_WORDS --save model-${{ matrix.name }}.bin" | tee train.log

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "words $MAX_WORDS, epochs ${{ matrix.epochs }}, hidden ${{ matrix.hidden }}, context ${{ matrix.context }}, vocab ${{ matrix.vocab }}" >> "$GITHUB_STEP_SUMMARY"
          grep "test perplexity" train.log | tail -n 1 >> "$GITHUB_STEP_SUMMARY" || echo "no result" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweep-${{ matrix.name }}
          path: |
            train.log
            model-${{ matrix.name }}.bin
          if-no-files-found: ignore
