name: train

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training passes over the text
        default: "2"
      emb:
        description: Size of each word embedding
        default: "16"
      hidden:
        description: Hidden layer size
        default: "64"
      lr:
        description: Learning rate
        default: "0.05"
      sentences:
        description: How many sentences to generate
        default: "3"
      seed:
        description: Words to start each sentence with
        default: "java is"
      context:
        description: Previous words the model looks at
        default: "3"
      threads:
        description: Training threads
        default: "4"
      vocab:
        description: Number of words in the vocabulary
        default: "2000"
      batch:
        description: Words per weight update (1 = per-word-training)
        default: "1"
      words:
        description: Max training words (the full data has 50 million, 0 = all of it)
        default: "5000000"

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Download training data
        run: ./gradlew downloadData

      - name: Train and generate
        shell: bash
        run: |
          set -o pipefail
          MAX_WORDS=""
          if [ "${{ inputs.words }}" != "0" ]; then MAX_WORDS="--max-words ${{ inputs.words }}"; fi
          ./gradlew run --args="--debug --epochs ${{ inputs.epochs }} --emb ${{ inputs.emb }} --hidden ${{ inputs.hidden }} --lr ${{ inputs.lr }} --sentences ${{ inputs.sentences }} --seed '${{ inputs.seed }}' --context ${{ inputs.context }} --threads ${{ inputs.threads }} --vocab ${{ inputs.vocab }} --batch ${{ inputs.batch }} $MAX_WORDS --save model.bin" | tee train.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-log
          path: train.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model
          path: model.bin
          if-no-files-found: ignore
